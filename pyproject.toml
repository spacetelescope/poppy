[build-system]
requires = [
    "setuptools >= 61.2",
    "setuptools_scm[toml]>=7.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "poppy"
description = "Physical optics propagation (wavefront diffraction) for optical simulations, particularly of telescopes."
authors = [
    { name = "Marshall Perrin", email = "mperrin@stsci.edu" },
]
requires-python = ">=3.12"
dependencies = [
    "numexpr>=2.11",
    "numpy>=2.1",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "astropy>=7.0",
]
dynamic = [
    "version",
]
readme = "README.rst"
license-files = ["LICENSE.md"]

[project.optional-dependencies]
all = [
    "synphot",
]
test = [
    "pytest>=9",
    "pytest-astropy",
    "docutils",
    "sphinx",
]
docs = [
    "nbsphinx",
    "sphinx",
    "stsci_rtd_theme",
    "sphinx-astropy",
    "sphinx-automodapi",
    "sphinx-issues",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/spacetelescope/poppy"
Documentation = "https://poppy-optics.readthedocs.io/"
"Bug Tracker" = "https://github.com/spacetelescope/poppy/issues"

[tool.pytest]
minversion = "9"
norecursedirs = ["build", "docs/_build"]
testpaths = ["poppy", "docs"]
astropy_header = true
doctest_plus = "enabled"
text_file_format = "rst"
addopts = ["-p no:warnings"]

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
"*" = [
    "*.fits",
    "*.csv",
]
"poppy.tests" = [
    "data/*",
]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "poppy/version.py"
write_to_template = "__version__ = '{version}'\n"

[tool.coverage.run]
source = [
    "poppy",
]
omit = [
    "poppy/conftest*",
    "poppy/cython_version*",
    "poppy/setup_package*",
    "poppy/*/setup_package*",
    "poppy/*/*/setup_package*",
    "poppy/tests/*",
    "poppy/*/tests/*",
    "poppy/*/*/tests/*",
    "poppy/version*",
    "*/poppy/conftest*",
    "*/poppy/cython_version*",
    "*/poppy/setup_package*",
    "*/poppy/*/setup_package*",
    "*/poppy/*/*/setup_package*",
    "*/poppy/tests/*",
    "*/poppy/*/tests/*",
    "*/poppy/*/*/tests/*",
    "*/poppy/version*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "def main(.*):",
    "pragma: py{ignore_python_version}",
]
omit = [
    "poppy/conftest*",
    "poppy/cython_version*",
    "poppy/setup_package*",
    "poppy/*/setup_package*",
    "poppy/*/*/setup_package*",
    "poppy/tests/*",
    "poppy/*/tests/*",
    "poppy/*/*/tests/*",
    "poppy/version*",
    "*/poppy/conftest*",
    "*/poppy/cython_version*",
    "*/poppy/setup_package*",
    "*/poppy/*/setup_package*",
    "*/poppy/*/*/setup_package*",
    "*/poppy/tests/*",
    "*/poppy/*/tests/*",
    "*/poppy/*/*/tests/*",
    "*/poppy/version*",
]

[tool.ruff]
line-length = 120          # scientific code with array literals often wants more room than 88
target-version = "py312"   # match the minimum supported Python version

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "NPY", # numpy-specific rules, if you use numpy
]
ignore = [
    "E501",  # line too long — formatter handles this; don't fight it on data literals
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # notebooks often have imports after code cells

[tool.ruff.format]
quote-style = "double"
