name: CI

on: [push, pull_request]

env:
  PYSYN_CDBS: "https://ssb.stsci.edu/trds"

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Coverage test in Python 3
            os: ubuntu-24.04    # TEMPORARY: pinned because ubuntu-latest (26.04) lacks conda, move back to -latest later
            python: '3.12'
            toxenv: py312-syn-cov

          - name: Check for Sphinx doc build errors
            os: ubuntu-24.04    # TEMPORARY: pinned because ubuntu-latest (26.04) lacks conda, move back to -latest later
            python: '3.12'
            toxenv: docbuild

          - name: Check accelerated math version
            os: ubuntu-24.04    # TEMPORARY: pinned because ubuntu-latest (26.04) lacks conda, move back to -latest later
            python: '3.12'
            toxenv: py312-numexpr-mkl-cov

          - name: Try Astropy development version
            os: ubuntu-24.04    # TEMPORARY: pinned because ubuntu-latest (26.04) lacks conda, move back to -latest later
            python: '3.12'
            toxenv: py312-astropydev-test

          - name: Try latest versions of all dependencies
            os: ubuntu-24.04    # TEMPORARY: pinned because ubuntu-latest (26.04) lacks conda, move back to -latest later
            python: '3.14'
            toxenv: py314-latest-test

          - name: Try minimum supported versions
            os: ubuntu-24.04    # TEMPORARY: pinned because ubuntu-latest (26.04) lacks conda, move back to -latest later
            python: '3.12'
            toxenv: py312-legacy-test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install Python dependencies
      run: pip install tox tox-conda>=0.2

    - name: Check conda info
      run: conda info

    - name: Run tests
      run: tox -e ${{ matrix.toxenv }}

    - name: Upload coverage to codecov
      if: ${{ contains(matrix.toxenv,'-cov') }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #v7.1.1
      with:
        files: ./coverage.xml
