name: CI

on: [push, pull_request]

env:
  PYSYN_CDBS: "https://ssb.stsci.edu/trds"

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Coverage test in Python 3
            os: ubuntu-latest
            python: '3.12'
            toxenv: py312-syn-cov

          - name: Check for Sphinx doc build errors
            os: ubuntu-latest
            python: '3.12'
            toxenv: docbuild

          - name: Check accelerated math version
            os: ubuntu-latest
            python: '3.12'
            toxenv: py312-numexpr-mkl-cov

          - name: Try Astropy development version
            os: ubuntu-latest
            python: '3.12'
            toxenv: py312-astropydev-test

          - name: Try latest versions of all dependencies
            os: ubuntu-latest
            python: '3.14'
            toxenv: py314-latest-test

          - name: Try minimum supported versions
            os: ubuntu-latest
            python: '3.12'
            toxenv: py312-legacy-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Python dependencies
      run: pip install tox tox-conda>=0.2

    - name: Check conda info
      run: conda info

    - name: Run tests
      run: tox -e ${{ matrix.toxenv }}

    - name: Upload coverage to codecov
      if: ${{ contains(matrix.toxenv,'-cov') }}
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
